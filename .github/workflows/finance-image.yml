name: Finance fork image

on:
  pull_request:
  push:
    branches: [main, feature/devops-environments]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: GHCR login on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/ezbookkeeping" >> "$GITHUB_OUTPUT"
      # The Dockerfile runs backend/frontend lint, unit tests and both builds.
      # External exchange-rate API tests are opt-in; CI remains offline for them.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          load: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=finance-fork
          cache-to: type=gha,mode=max,scope=finance-fork
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Immutable fork digest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$IMAGE" > bookkeeping-image.txt
          printf 'DEV_BOOKKEEPING_IMAGE=%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: bookkeeping-image
          path: bookkeeping-image.txt
          retention-days: 90
